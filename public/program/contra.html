<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>魂斗罗 | CONTRA</title>
  <link rel="stylesheet" href="eastyle.css">
  <style>
    .eg-stage {
      width: min(92vw, 800px);
      margin: 0 auto;
    }

    canvas {
      width: 100%;
      height: auto;
    }

    .eg-controls span { font-size: 10px; }
  </style>
</head>

<body>
  <main class="eg-shell">
    <header class="eg-header">
      <div class="eg-stats">
        <span class="eg-stat">生命 <b id="hp">3</b></span>
        <span class="eg-stat">得分 <b id="score">0</b></span>
      </div>
      <h1 class="eg-title">魂斗罗</h1>
      <div class="eg-actions">
        <a class="eg-link" href="../index.html#/easter-egg">&larr; 返回</a>
        <button class="eg-btn" id="btn-start">开始游戏</button>
      </div>
    </header>

    <div class="eg-stage">
      <canvas id="canvas" width="800" height="500"></canvas>
    </div>

    <div class="eg-controls">
      <span>&larr; &rarr; / A D 移动</span>
      <span>&uarr; / W 跳跃</span>
      <span>空格 / J 射击</span>
    </div>
  </main>

  <div class="eg-overlay" id="overlay">
    <h2 id="overlay-msg"></h2>
    <p id="overlay-detail"></p>
    <div class="eg-actions">
      <button class="eg-btn" id="overlay-btn">开始游戏</button>
    </div>
  </div>

  <script type="module">
    // ===== 魂斗罗 — ECHOID 重构版 =====
    // 现代写法：实体类 + 弹幕/敌人/粒子对象池 + 单循环

    const W = 800, H = 500;
    const GRAVITY = 0.4;
    const GROUND_Y = 420;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hpEl = document.getElementById('hp');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlayDetail = document.getElementById('overlay-detail');

    // ===== 实体 =====
    class Bullet {
      constructor(x, y, vx, vy) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.w = 6; this.h = 3;
        this.alive = true;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.alive = false;
      }
    }

    class Enemy {
      constructor(x, y, type) {
        this.x = x; this.y = y;
        this.w = 30; this.h = 36;
        this.type = type;
        this.vx = type === 'runner' ? 1.5 : 0;
        this.hp = type === 'tank' ? 3 : 1;
        this.frame = 0;
        this.alive = true;
      }
      update() {
        this.x += this.vx;
        this.frame++;
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = Math.random() * -6 - 2;
        this.life = 20;
      }
      update() { this.x += this.vx; this.y += this.vy; this.life--; }
    }

    // ===== 状态 =====
    const state = {
      px: 100, py: GROUND_Y - 40, pw: 30, ph: 40,
      vx: 0, vy: 0, grounded: true, facing: true,
      hp: 3, score: 0,
      bullets: [], enemies: [], particles: [],
      shootCD: 0, keys: {},
      playing: false, over: false, won: false,
    };

    let animId = null;

    function spawnEnemies() {
      state.enemies = [];
      for (let col = 0; col < 6; col++) {
        const type = col % 3 === 2 ? 'tank' : (col % 3 === 1 ? 'runner' : 'grunt');
        state.enemies.push(new Enemy(600 + col * 120 + Math.random() * 50, GROUND_Y - 36, type));
      }
    }

    function start() {
      state.px = 100; state.py = GROUND_Y - 40;
      state.vx = 0; state.vy = 0; state.grounded = true; state.facing = true;
      state.hp = 3; state.score = 0;
      state.bullets = []; state.particles = [];
      state.shootCD = 0;
      state.playing = true; state.over = false; state.won = false;
      spawnEnemies();
      overlay.classList.remove('show');
      if (!animId) animId = requestAnimationFrame(loop);
    }

    function shoot() {
      if (state.shootCD > 0 || !state.playing || state.over) return;
      const dir = state.facing ? 1 : -1;
      state.bullets.push(new Bullet(state.px + (dir > 0 ? state.pw : 0), state.py + state.ph / 2, dir * 7, 0));
      state.shootCD = 15;
    }

    function update() {
      if (!state.playing || state.over || state.won) return;
      if (state.shootCD > 0) state.shootCD--;

      // 移动 / 跳跃 / 射击
      const { keys } = state;
      if (keys.ArrowLeft || keys.KeyA) { state.vx = -3; state.facing = false; }
      else if (keys.ArrowRight || keys.KeyD) { state.vx = 3; state.facing = true; }
      else state.vx = 0;
      if ((keys.ArrowUp || keys.KeyW) && state.grounded) { state.vy = -10; state.grounded = false; }
      if (keys.Space || keys.KeyJ) shoot();

      // 物理
      state.vy += GRAVITY;
      state.px += state.vx;
      state.py += state.vy;
      if (state.px < 0) state.px = 0;
      if (state.px > W - state.pw) state.px = W - state.pw;
      if (state.py >= GROUND_Y - state.ph) { state.py = GROUND_Y - state.ph; state.vy = 0; state.grounded = true; }

      // 子弹 / 敌人 / 粒子
      state.bullets.forEach((b) => b.update());
      state.bullets = state.bullets.filter((b) => b.alive);
      state.enemies.forEach((e) => e.update());

      // 碰撞检测：子弹 × 敌人
      for (let i = state.bullets.length - 1; i >= 0; i--) {
        for (let j = state.enemies.length - 1; j >= 0; j--) {
          const b = state.bullets[i], e = state.enemies[j];
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            b.alive = false;
            e.hp--;
            if (e.hp <= 0) {
              e.alive = false;
              state.score += e.type === 'tank' ? 300 : 100;
              for (let k = 0; k < 8; k++) state.particles.push(new Particle(e.x + e.w / 2, e.y + e.h / 2));
            }
            break;
          }
        }
      }
      state.enemies = state.enemies.filter((e) => e.alive);
      state.particles.forEach((p) => p.update());
      state.particles = state.particles.filter((p) => p.life > 0);

      // 胜利判定
      if (!state.enemies.length && state.playing) {
        state.won = true;
        state.playing = false;
        overlayMsg.textContent = 'VICTORY';
        overlayDetail.textContent = `得分 ${state.score}`;
        document.getElementById('overlay-btn').textContent = '再来一局';
        overlay.classList.add('show');
      }
    }

    // ===== 渲染（ECHOID 单色战场） =====
    function drawBg() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#030303');
      g.addColorStop(0.7, '#0a0a0a');
      g.addColorStop(1, '#111');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // 远景网格线
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 80) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      // 地平线
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, GROUND_Y, W, 2);
    }

    function drawPlayer() {
      const { px, py, pw, ph, facing } = state;
      // 身体
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.roundRect(px, py, pw, ph, 4);
      ctx.fill();
      // 头部护目镜
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(px + pw / 2, py + ph / 2, 5, 0, Math.PI * 2);
      ctx.fill();
      // 枪口
      const gx = facing ? px + pw - 2 : px;
      ctx.fillStyle = '#fff';
      ctx.fillRect(gx, py + ph / 2 - 2, facing ? 12 : -12, 4);
    }

    function drawBullet(b) {
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 6;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.shadowBlur = 0;
    }

    function drawEnemy(e) {
      const fill = e.type === 'tank' ? '#3a3a3a' : '#2a2a2a';
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.roundRect(e.x, e.y, e.w, e.h, 3);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(e.x + 4, e.y + 4, e.w - 8, 2); // 眼睛
      if (e.type === 'runner') {
        const lo = Math.sin(e.frame * 0.3) * 4;
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x + 4, e.y + e.h, 6, 6 + lo);
        ctx.fillRect(e.x + e.w - 10, e.y + e.h, 6, 6 - lo);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBg();
      drawPlayer();
      state.bullets.forEach(drawBullet);
      state.enemies.forEach(drawEnemy);
      state.particles.forEach((p) => {
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = p.life / 20;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });
      hpEl.textContent = state.hp;
      scoreEl.textContent = state.score;
    }

    function loop() {
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    // ===== 输入 =====
    document.addEventListener('keydown', (e) => {
      if (!state.playing) return;
      state.keys[e.code] = true;
      if (e.code === 'Space') e.preventDefault();
    });
    document.addEventListener('keyup', (e) => { state.keys[e.code] = false; });

    document.getElementById('btn-start').addEventListener('click', () => { start(); if (!animId) loop(); });
    document.getElementById('overlay-btn').addEventListener('click', () => { start(); if (!animId) loop(); });

    start();
  </script>
</body>

</html>
