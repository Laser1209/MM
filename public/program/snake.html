<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>贪吃蛇 | SNAKE</title>
  <link rel="stylesheet" href="eastyle.css">
  <style>
    .eg-stage {
      width: min(80vw, 400px);
      margin: 0 auto;
    }

    canvas {
      width: 100%;
      height: auto;
      touch-action: none;
    }
  </style>
</head>

<body>
  <main class="eg-shell">
    <header class="eg-header">
      <div class="eg-stats">
        <span class="eg-stat">得分 <b id="score">0</b></span>
        <span class="eg-stat">最高 <b id="highscore">0</b></span>
      </div>
      <h1 class="eg-title">贪吃蛇</h1>
      <div class="eg-actions">
        <a class="eg-link" href="../index.html#/easter-egg">&larr; 返回</a>
        <button class="eg-btn" id="btn-restart">重新开始</button>
      </div>
    </header>

    <div class="eg-stage">
      <canvas id="canvas" width="400" height="400"></canvas>
    </div>

    <div class="eg-controls">
      <span>方向键 / WASD 控制</span>
      <span>空格 重新开始</span>
      <span>触屏滑动</span>
    </div>
  </main>

  <div class="eg-overlay" id="overlay">
    <h2 id="overlay-msg">游戏结束</h2>
    <p id="overlay-score"></p>
    <div class="eg-actions">
      <button class="eg-btn" id="overlay-btn">再来一局</button>
    </div>
  </div>

  <script type="module">
    // ===== 贪吃蛇 — ECHOID 重构版 =====
    // 现代写法：配置常量 + 独立状态对象 + 纯函数更新 + 单循环渲染

    const GRID = 20;
    const SIZE = 400;
    const COLS = SIZE / GRID;
    const ROWS = SIZE / GRID;
    const SPEED_MS = 100;
    const STORAGE_KEY = 'snakeHighScore';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlayScore = document.getElementById('overlay-score');

    // 方向向量表
    const DIRS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };
    const KEY_MAP = {
      ArrowUp: 'up', KeyW: 'up',
      ArrowDown: 'down', KeyS: 'down',
      ArrowLeft: 'left', KeyA: 'left',
      ArrowRight: 'right', KeyD: 'right',
    };

    const state = {
      snake: [],
      direction: null,     // 当前实际方向
      queue: [],           // 输入缓冲队列（连按不丢失）
      food: null,
      score: 0,
      highScore: 0,
      over: false,
    };

    let loopId = null;
    let lastTime = 0;

    function clone(v) { return { x: v.x, y: v.y }; }
    function cellKey(p) { return `${p.x},${p.y}`; }

    function randomPos() {
      let p;
      const occupied = new Set(state.snake.map(cellKey));
      do {
        p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (occupied.has(cellKey(p)));
      return p;
    }

    function init() {
      state.snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      state.direction = clone(DIRS.right);
      state.queue = [];
      state.score = 0;
      state.highScore = Number(localStorage.getItem(STORAGE_KEY) || 0);
      state.food = randomPos();
      state.over = false;
      overlay.classList.remove('show');
      syncStats();
      draw();
    }

    // 将输入入队，禁止 180° 掉头，只保留最近 2 步
    function pushDirection(dir) {
      const last = state.queue.length ? state.queue[state.queue.length - 1] : state.direction;
      if (dir.x === -last.x && dir.y === -last.y) return;
      if (last.x === dir.x && last.y === dir.y) return;
      if (state.queue.length < 2) state.queue.push(dir);
    }

    function step() {
      if (state.queue.length) state.direction = state.queue.shift();
      const head = clone(state.snake[0]);
      head.x += state.direction.x;
      head.y += state.direction.y;

      // 穿越边界：从对面的墙出现
      if (head.x < 0) head.x = COLS - 1;
      else if (head.x >= COLS) head.x = 0;
      if (head.y < 0) head.y = ROWS - 1;
      else if (head.y >= ROWS) head.y = 0;
      // 撞自己（尾部移动时允许）
      const willGrow = head.x === state.food.x && head.y === state.food.y;
      const body = willGrow ? state.snake : state.snake.slice(0, -1);
      if (body.some((s) => s.x === head.x && s.y === head.y)) return end();

      state.snake.unshift(head);
      if (willGrow) {
        state.score += 10;
        state.food = randomPos();
      } else {
        state.snake.pop();
      }
      syncStats();
    }

    function end() {
      state.over = true;
      if (state.score > state.highScore) {
        state.highScore = state.score;
        localStorage.setItem(STORAGE_KEY, String(state.highScore));
      }
      syncStats();
      overlayMsg.textContent = 'GAME OVER';
      overlayScore.textContent = `得分 ${state.score} · 最高 ${state.highScore}`;
      overlay.classList.add('show');
    }

    function syncStats() {
      scoreEl.textContent = state.score;
      highscoreEl.textContent = state.highScore;
    }

    // ===== 渲染（ECHOID 单色） =====
    function draw() {
      ctx.clearRect(0, 0, SIZE, SIZE);

      // 背景网格
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let i = 1; i < COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(SIZE, i * GRID);
        ctx.stroke();
      }

      // 食物
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(state.food.x * GRID + GRID / 2, state.food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
      ctx.fill();

      // 蛇：头部亮白，身体渐变灰
      state.snake.forEach((s, i) => {
        const alpha = 1 - i * 0.05;
        ctx.fillStyle = i === 0 ? '#fff' : `rgba(255,255,255,${Math.max(alpha, 0.35)})`;
        ctx.beginPath();
        ctx.roundRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2, 5);
        ctx.fill();
      });

      // 游戏结束时的蒙层文字
      if (state.over) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, SIZE, SIZE);
      }
    }

    function loop(timestamp) {
      if (!state.over && timestamp - lastTime >= SPEED_MS) {
        lastTime = timestamp;
        step();
      }
      draw();
      loopId = requestAnimationFrame(loop);
    }

    function restart() {
      cancelAnimationFrame(loopId);
      init();
      loopId = requestAnimationFrame(loop);
    }

    // ===== 输入 =====
    document.addEventListener('keydown', (e) => {
      if (KEY_MAP[e.code]) {
        e.preventDefault();
        if (state.over) restart();
        else pushDirection(DIRS[KEY_MAP[e.code]]);
      }
      if (e.code === 'Space') {
        e.preventDefault();
        restart();
      }
    });

    let touchStart = null;
    canvas.addEventListener('touchstart', (e) => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) > Math.abs(dy)) pushDirection(DIRS[dx > 0 ? 'right' : 'left']);
      else pushDirection(DIRS[dy > 0 ? 'down' : 'up']);
      touchStart = null;
      e.preventDefault();
    }, { passive: false });

    document.getElementById('btn-restart').addEventListener('click', restart);
    document.getElementById('overlay-btn').addEventListener('click', restart);

    init();
    loopId = requestAnimationFrame(loop);
  </script>
</body>

</html>
