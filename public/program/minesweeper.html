<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>扫雷 | MINESWEEPER</title>
  <link rel="stylesheet" href="eastyle.css">
  <style>
    .board {
      display: grid;
      gap: 2px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--eg-border);
      border-radius: 4px;
      width: max-content;
      margin: 0 auto;
      max-width: 95vw;
      overflow: auto;
    }

    .cell {
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-family: var(--eg-font-mono);
      font-size: 14px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .cell:hover:not(.revealed):not(.flagged) {
      background: rgba(255, 255, 255, 0.12);
    }

    .cell.revealed {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.06);
      cursor: default;
    }

    .cell.flagged {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .cell.mine {
      background: rgba(255, 255, 255, 0.28);
      color: #fff;
    }

    /* 数字 1-8：以白色亮度递减表达 */
    .n1 { color: #fff; }
    .n2 { color: rgba(255, 255, 255, 0.92); }
    .n3 { color: rgba(255, 255, 255, 0.82); }
    .n4 { color: rgba(255, 255, 255, 0.72); }
    .n5 { color: rgba(255, 255, 255, 0.62); }
    .n6 { color: rgba(255, 255, 255, 0.52); }
    .n7 { color: rgba(255, 255, 255, 0.42); }
    .n8 { color: rgba(255, 255, 255, 0.34); }

    .level-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .eg-btn--active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
  </style>
</head>

<body>
  <main class="eg-shell">
    <header class="eg-header">
      <div class="eg-stats">
        <span class="eg-stat">旗 <b id="flag">0</b></span>
        <span class="eg-stat">雷 <b id="mines">10</b></span>
        <span class="eg-stat">时 <b id="time">0</b></span>
      </div>
      <h1 class="eg-title">扫雷</h1>
      <div class="eg-actions">
        <a class="eg-link" href="../index.html#/easter-egg">&larr; 返回</a>
        <div class="level-row">
          <button class="eg-btn eg-btn--active" data-lvl="easy">简单</button>
          <button class="eg-btn" data-lvl="medium">中等</button>
          <button class="eg-btn" data-lvl="hard">困难</button>
        </div>
        <button class="eg-btn" id="btn-restart">重新开始</button>
      </div>
    </header>

    <div class="eg-stage">
      <div class="board" id="board"></div>
    </div>

    <div class="eg-controls">
      <span>左键 翻开</span>
      <span>右键 插旗</span>
      <span>翻开所有空白格</span>
    </div>
  </main>

  <div class="eg-overlay" id="overlay">
    <h2 id="overlay-msg"></h2>
    <p id="overlay-detail"></p>
    <div class="eg-actions">
      <button class="eg-btn" id="overlay-btn">再来一局</button>
    </div>
  </div>

  <script type="module">
    // ===== 扫雷 — ECHOID 重构版 =====
    // 现代写法：配置表驱动 + 纯函数游戏逻辑 + 数据驱动渲染

    const CFG = {
      easy: { rows: 9, cols: 9, mines: 10 },
      medium: { rows: 16, cols: 16, mines: 40 },
      hard: { rows: 16, cols: 30, mines: 99 },
    };

    const MINE = -1;

    const boardEl = document.getElementById('board');
    const flagEl = document.getElementById('flag');
    const mineEl = document.getElementById('mines');
    const timeEl = document.getElementById('time');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlayDetail = document.getElementById('overlay-detail');

    const state = {
      level: 'easy',
      grid: null,       // grid[r][c] = mine count or MINE
      revealed: null,
      flagged: null,
      flags: 0,
      over: false,
      won: false,
      startAt: null,
      timer: null,
    };

    function make2d(rows, cols, val) {
      return Array.from({ length: rows }, () => Array(cols).fill(val));
    }

    // 纯函数：以 r,c 为中心的邻域坐标
    function neighbors(r, c) {
      const { rows, cols } = CFG[state.level];
      const list = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) list.push([nr, nc]);
        }
      }
      return list;
    }

    function plantMines() {
      const { rows, cols, mines } = CFG[state.level];
      const grid = make2d(rows, cols, 0);
      let placed = 0;
      while (placed < mines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (grid[r][c] !== MINE) { grid[r][c] = MINE; placed++; }
      }
      // 计算数字
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === MINE) continue;
          grid[r][c] = neighbors(r, c).filter(([nr, nc]) => grid[nr][nc] === MINE).length;
        }
      }
      return grid;
    }

    function init(lvl) {
      if (state.timer) clearInterval(state.timer);
      state.level = lvl || state.level;
      const { rows, cols, mines } = CFG[state.level];
      state.grid = plantMines();
      state.revealed = make2d(rows, cols, false);
      state.flagged = make2d(rows, cols, false);
      state.flags = 0;
      state.over = false;
      state.won = false;
      state.startAt = null;
      state.timer = null;

      // 同步难度按钮状态
      document.querySelectorAll('[data-lvl]').forEach((b) => {
        b.classList.toggle('eg-btn--active', b.dataset.lvl === state.level);
      });
      overlay.classList.remove('show');
      syncUI();
      render();
    }

    function reveal(r, c) {
      if (state.over || state.revealed[r][c] || state.flagged[r][c]) return;
      state.revealed[r][c] = true;
      if (state.grid[r][c] === 0) neighbors(r, c).forEach(([nr, nc]) => reveal(nr, nc));
    }

    function open(r, c) {
      if (state.over || state.revealed[r][c] || state.flagged[r][c]) return;
      startTimer();

      // 踩雷
      if (state.grid[r][c] === MINE) {
        state.over = true;
        for (let i = 0; i < CFG[state.level].rows; i++) {
          for (let j = 0; j < CFG[state.level].cols; j++) {
            if (state.grid[i][j] === MINE) state.revealed[i][j] = true;
          }
        }
        endGame(false);
        return;
      }

      reveal(r, c);
      checkWin();
      syncUI();
      render();
    }

    function toggleFlag(r, c) {
      if (state.over || state.revealed[r][c]) return;
      state.flagged[r][c] = !state.flagged[r][c];
      state.flags += state.flagged[r][c] ? 1 : -1;
      syncUI();
      render();
    }

    function checkWin() {
      const { rows, cols, mines } = CFG[state.level];
      let revealedCount = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) if (state.revealed[r][c]) revealedCount++;
      }
      if (revealedCount === rows * cols - mines) {
        state.won = true;
        state.over = true;
        endGame(true);
      }
    }

    function endGame(won) {
      if (state.timer) clearInterval(state.timer);
      const secs = state.startAt ? Math.floor((Date.now() - state.startAt) / 1000) : 0;
      overlayMsg.textContent = won ? '通关' : 'GAME OVER';
      overlayDetail.textContent = won ? `用时 ${secs} 秒` : '踩到雷了';
      overlay.classList.add('show');
      syncUI();
      render();
    }

    function startTimer() {
      if (state.startAt) return;
      state.startAt = Date.now();
      state.timer = setInterval(() => {
        if (!state.over) timeEl.textContent = Math.floor((Date.now() - state.startAt) / 1000);
      }, 1000);
    }

    function syncUI() {
      flagEl.textContent = state.flags;
      mineEl.textContent = CFG[state.level].mines;
      if (!state.startAt) timeEl.textContent = '0';
    }

    // ===== 渲染（数据驱动，不依赖 emoji） =====
    function render() {
      const { rows, cols } = CFG[state.level];
      boardEl.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
      boardEl.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('button');
          cell.className = 'cell';

          if (state.revealed[r][c]) {
            cell.classList.add('revealed');
            if (state.grid[r][c] === MINE) {
              cell.classList.add('mine');
              cell.textContent = '●';
            } else if (state.grid[r][c] > 0) {
              cell.textContent = state.grid[r][c];
              cell.classList.add('n' + state.grid[r][c]);
            }
          } else if (state.flagged[r][c]) {
            cell.classList.add('flagged');
            cell.textContent = '✕';
          }

          cell.addEventListener('click', () => open(r, c));
          cell.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(r, c); });
          boardEl.appendChild(cell);
        }
      }
    }

    document.querySelectorAll('[data-lvl]').forEach((b) => b.addEventListener('click', () => init(b.dataset.lvl)));
    document.getElementById('btn-restart').addEventListener('click', () => init());
    document.getElementById('overlay-btn').addEventListener('click', () => init());

    init();
  </script>
</body>

</html>
