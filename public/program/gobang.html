<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>五子棋 | GOBANG</title>
  <link rel="stylesheet" href="eastyle.css">
  <style>
    .eg-stage {
      width: min(84vw, 512px);
      margin: 0 auto;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: auto;
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <main class="eg-shell">
    <header class="eg-header">
      <div class="eg-stats">
        <span class="eg-stat" id="player-info">当前 黑方</span>
        <span class="eg-chip">15 × 15</span>
      </div>
      <h1 class="eg-title">五子棋</h1>
      <div class="eg-actions">
        <a class="eg-link" href="../index.html#/easter-egg">&larr; 返回</a>
        <button class="eg-btn eg-btn--dim" id="btn-undo">悔棋</button>
        <button class="eg-btn" id="btn-restart">重新开始</button>
      </div>
    </header>

    <div class="eg-stage">
      <canvas id="canvas" width="512" height="512"></canvas>
    </div>

    <div class="eg-controls">
      <span>点击落子</span>
      <span>先手黑方</span>
      <span>悔棋可回退</span>
    </div>
  </main>

  <div class="eg-overlay" id="overlay">
    <h2 id="overlay-msg">黑方获胜</h2>
    <p>五子连珠，本局结束</p>
    <div class="eg-actions">
      <button class="eg-btn" id="overlay-btn">再来一局</button>
    </div>
  </div>

  <script type="module">
    // ===== 五子棋 — ECHOID 重构版 =====
    // 现代写法：纯函数胜负判定 + 状态集中管理 + 单次重绘

    const SIZE = 15;
    const CELL = 32;
    const PAD = 16;
    const WIN_LEN = 5;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const playerInfo = document.getElementById('player-info');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');

    const state = {
      board: null,        // board[y][x] -> 'black' | 'white' | null
      current: 'black',
      history: [],        // [{ x, y, player }]
      lastMove: null,
      over: false,
    };

    function emptyBoard() {
      return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    }

    function playerLabel(p) { return p === 'black' ? '黑方' : '白方'; }

    function init() {
      state.board = emptyBoard();
      state.current = 'black';
      state.history = [];
      state.lastMove = null;
      state.over = false;
      overlay.classList.remove('show');
      playerInfo.textContent = `当前 ${playerLabel('black')}`;
      draw();
    }

    // 纯函数：从 (x,y) 沿 (dx,dy) 双向统计连子数
    function countLine(x, y, dx, dy, p) {
      let c = 1;
      for (let s = 1; s < WIN_LEN; s++) {
        const nx = x + dx * s, ny = y + dy * s;
        if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE || state.board[ny][nx] !== p) break;
        c++;
      }
      for (let s = 1; s < WIN_LEN; s++) {
        const nx = x - dx * s, ny = y - dy * s;
        if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE || state.board[ny][nx] !== p) break;
        c++;
      }
      return c;
    }

    const DIRECTIONS = [[1, 0], [0, 1], [1, 1], [1, -1]];

    function checkWin(x, y, p) {
      return DIRECTIONS.some(([dx, dy]) => countLine(x, y, dx, dy, p) >= WIN_LEN);
    }

    function place(x, y) {
      if (state.over || state.board[y][x]) return;
      state.board[y][x] = state.current;
      state.history.push({ x, y, player: state.current });
      state.lastMove = { x, y };

      if (checkWin(x, y, state.current)) {
        state.over = true;
        draw();
        overlayMsg.textContent = `${playerLabel(state.current)}获胜`;
        overlay.classList.add('show');
        return;
      }
      state.current = state.current === 'black' ? 'white' : 'black';
      playerInfo.textContent = `当前 ${playerLabel(state.current)}`;
      draw();
    }

    function undo() {
      if (state.over || !state.history.length) return;
      const m = state.history.pop();
      state.board[m.y][m.x] = null;
      state.current = m.player;
      state.lastMove = state.history.length ? state.history[state.history.length - 1] : null;
      playerInfo.textContent = `当前 ${playerLabel(state.current)}`;
      draw();
    }

    // ===== 渲染（ECHOID 单色棋盘） =====
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 棋盘底色
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0c0c0c';
      ctx.fillRect(PAD - 6, PAD - 6, SIZE * CELL + 12, SIZE * CELL + 12);

      // 网格线
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 1;
      for (let i = 0; i < SIZE; i++) {
        const p = PAD + i * CELL;
        ctx.beginPath(); ctx.moveTo(PAD, p); ctx.lineTo(PAD + (SIZE - 1) * CELL, p); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, PAD + (SIZE - 1) * CELL); ctx.stroke();
      }

      // 星位
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (const [gx, gy] of [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]]) {
        ctx.beginPath();
        ctx.arc(PAD + gx * CELL, PAD + gy * CELL, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 棋子：黑子白描边，白子实心
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const p = state.board[y][x];
          if (!p) continue;
          const px = PAD + x * CELL, py = PAD + y * CELL, r = CELL / 2 - 2;
          if (p === 'black') {
            ctx.fillStyle = '#111';
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          } else {
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
          }
        }
      }

      // 最后一手高亮
      if (state.lastMove && !state.over) {
        const lx = PAD + state.lastMove.x * CELL, ly = PAD + state.lastMove.y * CELL;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(lx, ly, CELL / 2 - 1, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // ===== 输入 =====
    function canvasToCell(e) {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const mx = (e.clientX - rect.left) * scale - PAD;
      const my = (e.clientY - rect.top) * scale - PAD;
      return {
        x: Math.round(mx / CELL),
        y: Math.round(my / CELL),
      };
    }

    canvas.addEventListener('click', (e) => {
      const { x, y } = canvasToCell(e);
      if (x >= 0 && x < SIZE && y >= 0 && y < SIZE) place(x, y);
    });

    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-restart').addEventListener('click', init);
    document.getElementById('overlay-btn').addEventListener('click', init);

    init();
  </script>
</body>

</html>
